<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - TAMBAYAN</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #222; }
        .card { background: #fff; padding: 32px; border-radius: 8px; border: 1px solid #ddd; width: 360px; }
        h2 { margin: 0 0 20px; font-size: 22px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 9px 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        input:focus { outline: none; border-color: #2563eb; }
        ul.errorlist { color: #dc2626; font-size: 13px; list-style: none; padding: 0; margin: 0 0 12px; }
        .messages { padding: 10px; border-radius: 5px; background: #dcfce7; color: #15803d; font-size: 13px; margin-bottom: 16px; }
        .messages p { margin: 0; }
        button { width: 100%; background: #2563eb; color: #fff; padding: 10px; border: none; border-radius: 5px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        button:hover { background: #1d4ed8; }
        .footer-link { text-align: center; margin-top: 16px; font-size: 13px; color: #555; }
        .footer-link a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Log In to TAMBAYAN</h2>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        {{ form.non_field_errors }}

        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit">Log In</button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="{% url 'register' %}">Register</a>
        </div>
    </div>
</body>
</html>
