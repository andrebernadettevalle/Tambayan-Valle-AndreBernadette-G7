<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Listing - TAMBAYAN</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; margin: 0; color: #222; }
        .container { max-width: 480px; margin: 60px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 28px; text-align: center; }
        h2 { margin: 0 0 10px; font-size: 20px; }
        p { color: #555; font-size: 14px; margin-bottom: 22px; }
        .btn-row { display: flex; justify-content: center; gap: 12px; }
        .btn-del { background: #dc2626; color: #fff; border: none; padding: 9px 18px; border-radius: 5px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-cancel { padding: 9px 16px; border: 1px solid #ccc; border-radius: 5px; text-decoration: none; color: #333; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Delete Listing?</h2>
        <p>Are you sure you want to permanently remove <strong>"{{ listing.title }}"</strong>?</p>
        <form method="POST">
            {% csrf_token %}
            <div class="btn-row">
                <button type="submit" class="btn-del">Yes, Delete</button>
                <a href="{% url 'listing-detail' listing.pk %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
