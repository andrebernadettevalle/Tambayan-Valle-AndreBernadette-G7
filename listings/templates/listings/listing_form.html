<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ action }} - TAMBAYAN</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; margin: 0; color: #222; }
        nav { background: #fff; border-bottom: 1px solid #ddd; padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: 700; font-size: 18px; }
        .nav-actions a { color: #2563eb; text-decoration: none; font-size: 14px; margin-left: 16px; }
        .container { max-width: 600px; margin: 32px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 28px; }
        h2 { margin: 0 0 18px; font-size: 20px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 9px 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; }
        ul.errorlist { color: #dc2626; font-size: 12px; list-style: none; padding: 0; margin: 4px 0 0; }
        .btn-row { display: flex; gap: 10px; margin-top: 16px; }
        .btn-save { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 5px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-cancel { padding: 10px 16px; border: 1px solid #ccc; border-radius: 5px; text-decoration: none; color: #333; font-size: 14px; }
    </style>
</head>
<body>
    <nav>
        <span class="brand">TAMBAYAN</span>
        <div class="nav-actions">
            <a href="{% url 'listing-list' %}">Community Feed</a>
            <a href="{% url 'my-listings' %}">My Listings</a>
        </div>
    </nav>

    <div class="container">
        <h2>{{ action }}</h2>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <div class="btn-row">
                <button type="submit" class="btn-save">Save Listing</button>
                <a href="{% url 'listing-list' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
